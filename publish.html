<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>发布闲置 · 别丢</title>
<link rel="stylesheet" href="assets/app.css?v=20261023d">
</head>
<body>

<div class="loadbar" id="loadbar"></div>

<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="index.html"><svg class="mark" viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" rx="17" fill="#FF5A1F"/><path d="M16 22v10a12 12 0 0 0 24 0V22" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><rect x="22.4" y="9.2" width="11.2" height="11.2" rx="3.6" fill="#fff"/></svg>别丢</a>
    <div class="nav-links" id="navActions"></div>
  </div>
</nav>

<main class="wrap" style="max-width:720px;padding-top:34px">
  <div class="kicker" style="margin-bottom:12px">NEW LISTING</div>
  <h1 style="font-size:28px;letter-spacing:-.03em;margin-bottom:6px">发布闲置</h1>
  <p style="font-size:13.5px;color:var(--ink-2);margin-bottom:24px">
    照片会自动压缩。平台不收款，交易请当面验货。
  </p>

  <div class="panel">
    <div class="field">
      <label>标题</label>
      <input id="fTitle" type="text" maxlength="40" placeholder="例如：高数教材 第七版 九成新">
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field">
        <label>价格（元）</label>
        <input id="fPrice" type="number" min="0" step="0.1" value="0" placeholder="0 表示面议">
      </div>
      <div class="field">
        <label>分类</label>
        <select id="fCat">
          <option>教材书籍</option><option>学习资料</option><option>数码电子</option><option>生活用品</option><option>宿舍家具</option><option>服饰鞋包</option><option>运动器材</option><option>美妆个护</option><option>乐器文娱</option><option>交通工具</option><option>票券卡类</option><option>其他</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>描述</label>
      <textarea id="fBody" maxlength="1000" placeholder="成色、购买时间、有没有笔记、为什么出……"></textarea>
    </div>

    <div class="field">
      <label>图片（最多 3 张）</label>
      <div class="picker" id="picker">点击选择图片</div>
      <input id="fImg" type="file" accept="image/*" multiple hidden>
      <div class="thumbs" id="thumbs"></div>
      <div class="hint">自动压到 720px，单张约 60–120KB</div>
    </div>

    <div class="field">
      <label>联系方式</label>
      <input id="fContact" type="text" maxlength="60" placeholder="微信号或 QQ，不填则使用注册时的微信">
      <div class="hint">
        <label style="display:inline-flex;align-items:center;gap:7px;cursor:pointer">
          <input type="checkbox" id="fShow" checked style="width:auto">
          在详情页公开联系方式
        </label>
      </div>
    </div>

    <button class="btn block" id="submitBtn">发布</button>
  </div>
</main>

<footer class="foot">
  <div class="in">
    <div class="mono">CAMPUS MARKET</div>
    <p>发布免费 · 不抽成 · 不参与交易</p>
  </div>
</footer>

<div class="modal" id="limitModal">
  <div class="box">
    <h2>发布受限</h2>
    <div class="meta">系统风控</div>
    <div class="content" id="limitMsg"></div>
    <div class="field" style="margin-top:18px">
      <label>申请理由</label>
      <textarea id="applyReason" maxlength="300" placeholder="简单说明一下，例如：社团要清理一批闲置物资，希望临时提高限额"></textarea>
    </div>
    <div class="actions" style="display:flex;gap:10px">
      <button class="btn ghost" onclick="closeLimit()" style="flex:1">稍后再说</button>
      <button class="btn" onclick="submitApply()" id="applyBtn" style="flex:1">立刻申请</button>
    </div>
  </div>
</div>

<script src="assets/api.js?v=20261023d"></script>
<script src="assets/auth.js?v=20261023d"></script>
<script src="assets/img.js?v=20261023d"></script>
<script>
let files = [];

function paintThumbs() {
  document.getElementById('thumbs').innerHTML = files.map((f, i) => `
    <div class="thumb"><img src="${f.dataURL}" alt="">
      <span class="x" onclick="removeImg(${i})">×</span></div>`).join('');
}

function removeImg(i) {
  files.splice(i, 1);
  paintThumbs();
}

document.getElementById('picker').onclick = () => document.getElementById('fImg').click();

document.getElementById('fImg').onchange = async (e) => {
  const list = Array.from(e.target.files).slice(0, 3 - files.length);
  if (!list.length) return;
  for (const f of list) {
    try {
      const dataURL = await compressImage(f);
      files.push({ dataURL, name: f.name });
    } catch (err) {
      toast(err.message);
    }
  }
  paintThumbs();
  e.target.value = '';
};

async function submit() {
  if (!Auth.requireLogin('publish.html')) return;
  const title = document.getElementById('fTitle').value.trim();
  const body = document.getElementById('fBody').value.trim();
  const price = document.getElementById('fPrice').value || 0;
  const category = document.getElementById('fCat').value;
  const contact = document.getElementById('fContact').value.trim();
  const show = document.getElementById('fShow').checked ? 1 : 0;

  if (title.length < 1) return toast('请填写标题');
  if (title.length > 40) return toast('标题最多 40 个字');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;

  try {
    // 多张图并行上传：3 张图的耗时 ≈ 1 张，而不是 3 倍
    btn.textContent = files.length ? `上传 ${files.length} 张图片…` : '发布中…';
    const urls = await Promise.all(files.map(f => uploadImage(f.dataURL)));

    btn.textContent = '发布中…';
    const r = await api('/items', {
      method: 'POST',
      body: { title, body, price, category, contact, show_contact: show, images: urls }
    });
    location.href = 'item.html?id=' + r.id;
  } catch (e) {
    // 风控提示：弹窗 + 立刻申请入口
    if (/风控|发布商品过多/.test(e.message)) {
      showLimit(e.message);
    } else {
      toast(e.message);
    }
    btn.disabled = false;
    btn.textContent = '发布';
  }
}

document.getElementById('submitBtn').onclick = submit;

function showLimit(msg) {
  document.getElementById('limitMsg').textContent = msg;
  document.getElementById('limitModal').classList.add('show');
}
function closeLimit() {
  document.getElementById('limitModal').classList.remove('show');
}
async function submitApply() {
  const reason = document.getElementById('applyReason').value.trim();
  if (reason.length < 2) { toast('请简单说明申请理由'); return; }
  const btn = document.getElementById('applyBtn');
  btn.disabled = true;
  btn.textContent = '提交中…';
  try {
    const r = await api('/application', { method: 'POST', body: { reason } });
    closeLimit();
    document.getElementById('applyReason').value = '';
    alert(r.msg || '申请已提交，管理员审核后会解除限制');
  } catch (e) {
    toast(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '立刻申请';
  }
}

(async function () {
  await paintNav();
  const u = await Auth.verify();
  if (!u) { Auth.requireLogin('publish.html'); return; }
  if (u.wechat) document.getElementById('fContact').placeholder = '默认：' + u.wechat;
})();
</script>
</body>
</html>
