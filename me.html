<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>我的 · 校园二手</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="index.html"><span class="mark">二</span>校园二手</a>
    <div class="nav-links" id="navActions"></div>
  </div>
</nav>

<main class="wrap" style="max-width:760px;padding-top:34px">
  <div class="kicker" style="margin-bottom:12px">MY ACCOUNT</div>
  <h1 style="font-size:28px;letter-spacing:-.03em;margin-bottom:6px" id="nickname">我的</h1>
  <p style="font-size:13px;color:var(--ink-2);margin-bottom:22px" id="subtitle">加载中…</p>

  <div style="display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap">
    <a class="btn" href="publish.html">发布新闲置</a>
    <a class="btn ghost" href="index.html">去逛逛</a>
    <button class="btn ghost" id="logoutBtn">退出登录</button>
  </div>

  <h2 style="font-size:14px;font-weight:600;margin-bottom:12px">我的发布</h2>
  <div id="list"></div>
</main>

<footer class="foot">
  <div class="in">
    <div class="mono">CAMPUS MARKET</div>
    <p>只做信息撮合 · 不提供支付 · 交易请当面验货</p>
  </div>
</footer>

<script src="assets/api.js"></script>
<script src="assets/auth.js"></script>
<script>
const STATUS = { on: ['on', '在售'], sold: ['sold', '已出'], removed: ['off', '已下架'], pending: ['warn', '待审核'] };

function row(it) {
  const [cls, label] = STATUS[it.status] || ['', it.status];
  const img = it.thumb
    ? `<img src="${esc(it.thumb)}" alt="">`
    : `<div style="width:68px;height:68px;border-radius:8px;background:var(--surface-2)"></div>`;
  return `<div class="row">
    ${img}
    <div class="info">
      <div class="t">${esc(it.title)}</div>
      <div class="p">${priceText(it.price)}</div>
      <div class="m"><span class="badge ${cls}">${label}</span><span>${timeAgo(it.created_at)}</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;justify-content:center">
      <a class="btn ghost sm" href="item.html?id=${it.id}">查看</a>
      ${it.status === 'on' ? `<button class="btn danger sm" onclick="setStatus(${it.id},'sold')">已出</button>` : ''}
      ${it.status === 'on' ? `<button class="btn ghost sm" onclick="setStatus(${it.id},'removed')">下架</button>` : ''}
    </div>
  </div>`;
}

async function setStatus(id, to) {
  try {
    await api('/item/' + id + '/status', { method: 'POST', body: { to } });
    toast('已更新');
    load();
  } catch (e) { toast(e.message); }
}

async function load() {
  try {
    const r = await api('/my/items');
    document.getElementById('list').innerHTML = r.items.length
      ? r.items.map(row).join('')
      : `<div class="empty"><div class="big">EMPTY</div><p>还没有发布过东西<br><a href="publish.html" style="color:var(--accent)">发布第一件</a></p></div>`;
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="alert err">${esc(e.message)}</div>`;
  }
}

(async function () {
  await paintNav();
  const u = await Auth.verify();
  if (!u) { Auth.requireLogin('me.html'); return; }
  document.getElementById('nickname').textContent = u.nickname || ('同学' + u.id);
  document.getElementById('subtitle').textContent =
    `学号 ${u.sid} · 手机 ${u.phone_masked || '未填'} · ${u.role === 'admin' ? '管理员' : '普通用户'}`;
  document.getElementById('logoutBtn').onclick = () => {
    Auth.logout();
    location.href = 'index.html';
  };
  load();
})();
</script>
</body>
</html>
