<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>联系作者 · 别丢</title>
<link rel="stylesheet" href="assets/app.css?v=20261023f">
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="index.html">
      <svg class="mark" viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" rx="17" fill="#FF5A1F"/><path d="M16 22v10a12 12 0 0 0 24 0V22" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><rect x="22.4" y="9.2" width="11.2" height="11.2" rx="3.6" fill="#fff"/></svg>别丢
    </a>
    <div class="nav-links" id="navActions"></div>
  </div>
</nav>

<main class="wrap" style="max-width:640px;padding-top:38px">
  <div class="kicker" style="margin-bottom:12px">CONTACT</div>
  <h1 style="font-size:28px;letter-spacing:-.03em;margin-bottom:8px">联系作者</h1>
  <p style="font-size:13.5px;color:var(--ink-2);line-height:1.8;margin-bottom:24px">
    遇到问题、想反馈建议、想删除自己的信息，都可以在这里留言。<br>
    <strong>留言只有作者能看到</strong>，其他同学看不到你说的任何内容。
  </p>

  <div id="alert"></div>

  <div class="panel">
    <h2>写一条留言</h2>
    <form id="fbForm">
      <div class="field">
        <textarea id="fbBody" maxlength="500" placeholder="例如：我发布的东西被误删了，想恢复一下…" style="min-height:120px"></textarea>
        <div class="hint">2–500 字，每天最多 5 条</div>
      </div>
      <button class="btn block" id="fbBtn" type="submit">发送</button>
    </form>
  </div>

  <div class="panel">
    <h2>我的留言记录</h2>
    <div id="myList"><p style="font-size:13px;color:var(--ink-3)">加载中…</p></div>
  </div>
</main>

<footer class="foot">
  <div class="in">
    <div class="mono">别丢 · 电院闲置</div>
    <p>只做信息撮合 · 不提供支付 · 交易请当面验货</p>
  </div>
</footer>

<script src="assets/api.js?v=20261023f"></script>
<script src="assets/auth.js?v=20261023f"></script>
<script>
function renderList(rows) {
  const box = document.getElementById('myList');
  if (!rows.length) {
    box.innerHTML = '<p style="font-size:13px;color:var(--ink-3)">还没有留言过。有问题随时写给我们。</p>';
    return;
  }
  box.innerHTML = rows.map(r => `
    <div class="msg">
      <div class="txt">${esc(r.body)}</div>
      <div class="when">${esc(r.created_at)}</div>
      ${r.reply ? `<div style="margin-top:10px;background:var(--surface-2);border-radius:10px;padding:11px 13px">
        <div style="font-size:11.5px;color:var(--ink-3);margin-bottom:4px">作者回复</div>
        <div style="font-size:13.5px;line-height:1.7">${esc(r.reply)}</div></div>` : ''}
    </div>`).join('');
}

async function loadMy() {
  if (!Auth.logged) {
    document.getElementById('myList').innerHTML =
      '<p style="font-size:13px;color:var(--ink-3)"><a href="login.html?next=contact.html" style="color:var(--accent)">登录</a> 后可以查看自己的留言记录</p>';
    return;
  }
  try {
    const r = await api('/my/feedback');
    renderList(r.feedback);
  } catch (e) {
    document.getElementById('myList').innerHTML = `<p style="font-size:13px;color:var(--ink-3)">${esc(e.message)}</p>`;
  }
}

document.getElementById('fbForm').onsubmit = async (e) => {
  e.preventDefault();
  if (!Auth.requireLogin('contact.html')) return;
  const body = document.getElementById('fbBody').value.trim();
  const box = document.getElementById('alert');
  box.innerHTML = '';
  if (body.length < 2) { box.innerHTML = '<div class="alert err">至少写两个字</div>'; return; }

  const btn = document.getElementById('fbBtn');
  btn.disabled = true;
  btn.textContent = '发送中…';
  try {
    await api('/feedback', { method: 'POST', body: { body } });
    document.getElementById('fbBody').value = '';
    box.innerHTML = '<div class="alert ok">已收到，作者会尽快查看</div>';
    loadMy();
  } catch (err) {
    box.innerHTML = `<div class="alert err">${esc(err.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '发送';
  }
};

(async function () {
  await paintNav();
  await loadMy();
})();
</script>
</body>
</html>
