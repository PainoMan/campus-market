<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>注册 · 别丢</title>
<link rel="stylesheet" href="assets/app.css?v=20261023f">
<style>
.modal{
  position:fixed;inset:0;z-index:200;background:rgba(10,10,11,.45);
  display:none;align-items:flex-end;justify-content:center;
}
.modal.show{display:flex}
.sheet{
  width:100%;max-width:540px;background:#fff;
  border-radius:22px 22px 0 0;
  padding:24px 22px calc(22px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;
  animation:sheetIn .3s cubic-bezier(.22,.61,.36,1);
}
@keyframes sheetIn{
  from{transform:translateY(26px)}
  to{transform:none}
}
.sheet h2{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px}
.sheet .sub{font-size:13px;color:var(--ink-2);line-height:1.7;margin-bottom:18px}
.doc-link{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border:1px solid var(--line);border-radius:12px;
  margin-bottom:10px;font-size:14.5px;font-weight:500;
  transition:border-color .15s,background .15s;
}
.doc-link:hover{border-color:var(--line-strong);background:var(--surface-2)}
.doc-link span:last-child{color:var(--ink-3);font-size:12px}
.agree{
  display:flex;gap:10px;align-items:flex-start;
  margin:18px 0 16px;font-size:13.5px;line-height:1.6;cursor:pointer;
}
.agree input{
  width:20px;height:20px;flex-shrink:0;margin-top:1px;accent-color:var(--accent);cursor:pointer;
}
.sheet .tip{text-align:center;font-size:11.5px;color:var(--ink-3);margin-top:12px;line-height:1.7}
.close-x{
  background:none;border:none;font-size:22px;line-height:1;color:var(--ink-3);
  cursor:pointer;padding:4px 6px;margin:-4px -6px 0 0;
}

/* ============ 注册成功 · 欢迎层 ============ */
.welcome{
  position:fixed;inset:0;z-index:400;
  background:#FAF6F0;
  display:none;align-items:center;justify-content:center;
  flex-direction:column;text-align:center;padding:32px;
}
.welcome.show{display:flex}

.w-stage{position:relative;display:flex;flex-direction:column;align-items:center}

/* 品牌方块 */
.w-logo{position:relative;width:92px;height:92px;margin-bottom:34px}
.w-logo svg{width:100%;height:100%;display:block;position:relative;z-index:2;
  animation:logoIn .62s cubic-bezier(.34,1.4,.64,1);
  transform-origin:50% 50%;
}
@keyframes logoIn{from{transform:scale(.82)}to{transform:scale(1)}}

/* 扩散光环 */
.w-ring{
  position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;
  border-radius:28px;border:1.5px solid rgba(255,90,31,.45);
  animation:ringOut 1.5s .18s cubic-bezier(.22,.61,.36,1);opacity:0;
}
.w-ring.r2{animation-delay:.42s}
@keyframes ringOut{
  0%{transform:scale(1);opacity:.55}
  100%{transform:scale(2.1);opacity:0}
}

/* 对勾 */
.w-check{width:38px;height:38px;margin-bottom:26px}
.w-check svg{width:100%;height:100%;overflow:visible}
.w-check .ck-ring{
  fill:none;stroke:#34C759;stroke-width:2;stroke-linecap:round;
  stroke-dasharray:132;stroke-dashoffset:0;
  transform:rotate(-90deg);transform-origin:50% 50%;
  animation:drawRing .6s .42s cubic-bezier(.65,0,.35,1);
}
.w-check .ck-tick{
  fill:none;stroke:#34C759;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:26;stroke-dashoffset:0;
  animation:drawTick .34s .92s cubic-bezier(.65,0,.35,1);
}
@keyframes drawRing{from{stroke-dashoffset:132}to{stroke-dashoffset:0}}
@keyframes drawTick{from{stroke-dashoffset:26}to{stroke-dashoffset:0}}

/* 文案 */
.w-title{
  font-size:31px;font-weight:600;letter-spacing:-.042em;line-height:1.22;
  color:#1D1D1F;margin:0 0 14px;
  animation:riseIn .55s .68s cubic-bezier(.22,.61,.36,1);
}
.w-brand{color:#FF5A1F}
.w-sub{
  font-size:15px;color:#1D1D1F;line-height:1.6;letter-spacing:-.01em;margin:0;
  animation:riseIn .55s .82s cubic-bezier(.22,.61,.36,1);
}
.w-name{color:#FF5A1F;font-weight:600}
.w-sub2{
  font-size:13.5px;color:#86868B;line-height:1.9;letter-spacing:.005em;margin:7px 0 0;
  animation:riseIn .55s .92s cubic-bezier(.22,.61,.36,1);
}
.w-dots{
  display:flex;gap:7px;justify-content:center;margin-top:46px;
  animation:riseIn .55s 1.1s cubic-bezier(.22,.61,.36,1);
}
.w-dots span{
  width:5px;height:5px;border-radius:50%;background:#D1D1D6;
  animation:dotPulse 1.35s ease-in-out infinite;
}
.w-dots span:nth-child(2){animation-delay:.16s}
.w-dots span:nth-child(3){animation-delay:.32s}
@keyframes dotPulse{
  0%,100%{opacity:.35;transform:scale(.85)}
  50%{opacity:1;transform:scale(1)}
}
@keyframes riseIn{from{transform:translateY(10px)}to{transform:none}}

/* 尊重系统的「减少动态效果」 */
@media (prefers-reduced-motion: reduce){
  .welcome *, .welcome svg{animation:none!important}
  .w-ring{display:none}
}

/* 输入框 + 内嵌小按钮 */
.input-with-btn{position:relative;display:flex;gap:8px}
.input-with-btn input{flex:1;min-width:0}
.mini-btn{
  flex-shrink:0;padding:0 16px;height:46px;
  border:1px solid var(--line-strong);border-radius:12px;
  background:#fff;color:var(--ink);font-size:13px;font-family:inherit;
  cursor:pointer;transition:background .15s,border-color .15s;
  white-space:nowrap;
}
.mini-btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.mini-btn:active{transform:scale(.97)}
.mini-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="index.html">
      <svg class="mark" viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" rx="17" fill="#FF5A1F"/><path d="M16 22v10a12 12 0 0 0 24 0V22" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><rect x="22.4" y="9.2" width="11.2" height="11.2" rx="3.6" fill="#fff"/></svg>别丢
    </a>
    <div class="nav-links" id="navActions"></div>
  </div>
</nav>

<main class="wrap" style="max-width:430px;padding-top:42px;padding-bottom:60px">
  <div class="kicker" style="margin-bottom:12px">CREATE ACCOUNT</div>
  <h1 style="font-size:30px;letter-spacing:-.03em;margin-bottom:8px">注册</h1>
  <p style="font-size:13.5px;color:var(--ink-2);margin-bottom:24px">
    只面向本校同学。信息仅用于身份确认和交易联系，不会公开。
  </p>

  <div id="alert"></div>

  <form id="form">
    <div class="field">
      <label>手机号</label>
      <input id="phone" type="text" inputmode="numeric" maxlength="11" placeholder="11 位手机号，登录时也用它" required>
      <div class="hint">便于联系</div>
    </div>
    <div class="field">
      <label>微信号 / QQ 号</label>
      <input id="wechat" type="text" maxlength="40" placeholder="方便同学联系你" required>
    </div>
    <div class="field">
      <label>昵称（可选）</label>
      <div class="input-with-btn">
        <input id="nickname" type="text" maxlength="20" placeholder="会显示在商品和留言里">
        <button type="button" class="mini-btn" id="randNick" title="换一个">随机</button>
      </div>
      <div class="hint">想不到就点「随机」，再点一次换一个</div>
    </div>
    <div class="field">
      <label>密码</label>
      <input id="pwd" type="password" autocomplete="new-password" placeholder="至少 6 位" required>
    </div>

    <button class="btn block" id="btn" type="submit">创建账号</button>

    <p class="form-foot">
      点击「创建账号」后需阅读并同意
      <a href="notice.html" target="_blank">《用户须知》</a>与<a href="privacy.html" target="_blank">《隐私政策》</a><br>
      密码加密存储，手机号加密保存，任何其他用户都看不到
    </p>
  </form>
</main>

<!-- 同意确认层 -->
<div class="modal" id="consentModal">
  <div class="sheet">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
      <div>
        <h2>注册前请确认</h2>
        <p class="sub">使用本平台前，请阅读并同意以下两份文件。不同意将无法注册。</p>
      </div>
      <button class="close-x" onclick="closeConsent()" aria-label="关闭">×</button>
    </div>

    <a class="doc-link" href="notice.html" target="_blank">
      <span>用户须知（20 条）</span><span>阅读 ›</span>
    </a>
    <a class="doc-link" href="privacy.html" target="_blank">
      <span>隐私政策</span><span>阅读 ›</span>
    </a>

    <label class="agree">
      <input type="checkbox" id="agreeBox">
      <span>我已阅读并同意《用户须知》与《隐私政策》，理解本平台<strong>只提供信息展示，不参与交易、不提供支付与担保</strong>。</span>
    </label>

    <button class="btn block" id="agreeBtn">同意并继续</button>
    <p class="tip">签署时系统会记录你的昵称、签署时间与 IP，可在隐私政策页随时查看</p>
  </div>
</div>


<div class="welcome" id="welcome">
  <div class="w-stage">
    <div class="w-logo">
      <svg viewBox="0 0 56 56" aria-hidden="true">
        <rect width="56" height="56" rx="17" fill="#FF5A1F"/>
        <path d="M16 22v10a12 12 0 0 0 24 0V22" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/>
        <rect x="22.4" y="9.2" width="11.2" height="11.2" rx="3.6" fill="#fff"/>
      </svg>
      <span class="w-ring"></span>
      <span class="w-ring r2"></span>
    </div>

    <div class="w-check">
      <svg viewBox="0 0 44 44" aria-hidden="true">
        <circle class="ck-ring" cx="22" cy="22" r="21"/>
        <path class="ck-tick" d="M13 22.5 L19.5 29 L31 17"/>
      </svg>
    </div>

    <h2 class="w-title">欢迎加入 <span class="w-brand">别丢</span></h2>
    <p class="w-sub">你好，<span class="w-name" id="wName">同学</span></p>
    <p class="w-sub2">这里的东西，都来自同校的人</p>
    <div class="w-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<script src="assets/api.js?v=20261023f"></script>
<script src="assets/auth.js?v=20261023f"></script>
<script>
const form = document.getElementById('form');
const modal = document.getElementById('consentModal');
const agreeBox = document.getElementById('agreeBox');
let pendingData = null;

form.onsubmit = (e) => {
  e.preventDefault();
  const box = document.getElementById('alert');
  box.innerHTML = '';

  const phone = document.getElementById('phone').value.trim();
  const wechat = document.getElementById('wechat').value.trim();
  const nickname = document.getElementById('nickname').value.trim();
  const pwd = document.getElementById('pwd').value;

  if (!/^1[3-9]\d{9}$/.test(phone)) { box.innerHTML = '<div class="alert err">手机号格式不对</div>'; return; }
  if (!wechat) { box.innerHTML = '<div class="alert err">请填写微信号或 QQ 号</div>'; return; }
  if (pwd.length < 6) { box.innerHTML = '<div class="alert err">密码至少 6 位</div>'; return; }

  pendingData = { phone, wechat, nickname, pwd };
  openConsent();
};

function openConsent() {
  agreeBox.checked = false;
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeConsent() {
  modal.classList.remove('show');
  document.body.style.overflow = '';
  toast('请仔细阅读用户须知内容并同意才可使用本网站功能', 3200);
}

// 点击遮罩关闭
modal.addEventListener('click', (e) => {
  if (e.target === modal) closeConsent();
});

document.getElementById('agreeBtn').onclick = async () => {
  if (!agreeBox.checked) {
    toast('请先勾选「我已阅读并同意」');
    return;
  }
  const btn = document.getElementById('agreeBtn');
  btn.disabled = true;
  btn.textContent = '创建中…';

  try {
    const r = await api('/register', {
      method: 'POST',
      auth: false,
      body: { ...pendingData, agreed: true, consent_version: 'V1.0' }
    });
    Auth.save(r.token, r.user);
    modal.classList.remove('show');
    document.body.style.overflow = '';
    showWelcome(r.user);
  } catch (err) {
    modal.classList.remove('show');
    document.body.style.overflow = '';
    document.getElementById('alert').innerHTML = `<div class="alert err">${esc(err.message)}</div>`;
    btn.disabled = false;
    btn.textContent = '同意并继续';
  }
};

function showWelcome(user) {
  const w = document.getElementById('welcome');
  const nameEl = document.getElementById('wName');
  if (nameEl && user && user.nickname) nameEl.textContent = user.nickname;
  w.classList.add('show');
  // 尊重「减少动态效果」：直接进入
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => location.href = 'index.html', reduce ? 600 : 2900);
}


/* ---------- 随机昵称 ---------- */
const NICK_A = ['安静的','爱睡觉的','暴躁的','温柔的','快乐的','迷糊的','认真的',
                '发呆的','早起的','夜猫子','会飞的','吃瓜的','路过的','低调的',
                '闪亮的','慢半拍的','好奇的','社恐的','话痨的','佛系的'];
const NICK_B = ['橘子','柚子','柠檬','海豹','猫头鹰','柯基','团子','云朵','小满',
                '阿呆','小鹿','鲸鱼','土豆','栗子','向日葵','汽水','布丁','山楂',
                '麻雀','仓鼠','柚子茶','麦穗','蘑菇','大福','椰奶'];
function randomNick() {
  const a = NICK_A[Math.floor(Math.random() * NICK_A.length)];
  const b = NICK_B[Math.floor(Math.random() * NICK_B.length)];
  return a + b;
}
document.getElementById('randNick').addEventListener('click', function () {
  const inp = document.getElementById('nickname');
  inp.value = randomNick();
  // 轻微反馈：按钮闪一下
  this.textContent = '换一个';
  clearTimeout(this._t);
  this._t = setTimeout(() => { this.textContent = '随机'; }, 1200);
});

(async function () {
  await paintNav();
})();
</script>
</body>
</html>
