<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>我的消息 · 别丢</title>
<link rel="stylesheet" href="assets/app.css?v=20261023a">
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="index.html">
      <svg class="mark" viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" rx="17" fill="#FF5A1F"/><path d="M16 22v10a12 12 0 0 0 24 0V22" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><rect x="22.4" y="9.2" width="11.2" height="11.2" rx="3.6" fill="#fff"/></svg>别丢
    </a>
    <div class="nav-links" id="navActions"></div>
  </div>
</nav>

<main class="wrap" style="max-width:680px;padding-top:34px">
  <div class="kicker" style="margin-bottom:12px">MESSAGES</div>
  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
    <h1 style="font-size:28px;letter-spacing:-.03em">我的消息</h1>
    <button class="btn ghost sm" id="readAll" style="display:none">全部已读</button>
  </div>
  <p style="font-size:13px;color:var(--ink-2);margin:8px 0 22px" id="sub">加载中…</p>

  <div id="list"></div>
</main>

<footer class="foot">
  <div class="in">
    <div class="mono">别丢 · 电院闲置</div>
    <p>消息来自同学对你发布的商品留言</p>
  </div>
</footer>

<script src="assets/api.js?v=20261023a"></script>
<script src="assets/auth.js?v=20261023a"></script>
<script>
function row(n) {
  const unread = !n.is_read;
  return `<a class="row" href="item.html?id=${n.item_id}" data-nid="${n.id}"
    style="${unread ? 'border-color:var(--accent);background:var(--accent-soft)' : ''}">
    <div style="width:8px;padding-top:6px;flex-shrink:0">
      ${unread ? '<span style="display:block;width:7px;height:7px;border-radius:50%;background:var(--accent)"></span>' : ''}
    </div>
    <div class="info">
      <div class="t">${esc(n.item_title || '（商品已删除）')}</div>
      <div style="font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.6">${esc(n.body || '')}</div>
      <div class="m">${esc(n.created_at)}</div>
    </div>
  </a>`;
}

async function load() {
  try {
    const r = await api('/notifications');
    const unread = r.unread || 0;
    document.getElementById('sub').textContent =
      unread ? `有 ${unread} 条未读消息` : '暂无未读消息';

    const btn = document.getElementById('readAll');
    btn.style.display = unread ? 'inline-flex' : 'none';

    document.getElementById('list').innerHTML = r.notifications.length
      ? r.notifications.map(row).join('')
      : `<div class="empty"><div class="big">NO MESSAGES</div><p>还没有消息<br>有人在你发布的商品下留言时，会出现在这里</p></div>`;

    // 点击某条 → 标记已读
    document.querySelectorAll('[data-nid]').forEach(el => {
      el.addEventListener('click', () => {
        api('/notifications/read', { method: 'POST', body: { id: Number(el.dataset.nid) } }).catch(() => {});
      });
    });
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="alert err">${esc(e.message)}</div>`;
  }
}

(async function () {
  await paintNav();
  const u = await Auth.verify();
  if (!u) { Auth.requireLogin('messages.html'); return; }
  await load();

  document.getElementById('readAll').onclick = async () => {
    try {
      await api('/notifications/read', { method: 'POST', body: {} });
      load();
      toast('已全部标记为已读');
    } catch (e) { toast(e.message); }
  };
})();
</script>
</body>
</html>
