<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>别丢 · 同学的闲置流转</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div class="loadbar" id="loadbar"></div>

<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="index.html">
      <svg class="mark" viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" rx="17" fill="#FF5A1F"/><path d="M16 22v10a12 12 0 0 0 24 0V22" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><rect x="22.4" y="9.2" width="11.2" height="11.2" rx="3.6" fill="#fff"/></svg>别丢
    </a>
    <div class="nav-links" id="navActions">
      <a href="login.html">登录</a>
      <a class="primary" href="register.html">注册</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="hero-in">
    <div class="kicker">CAMPUS MARKET · 2026</div>
    <h1>同学的闲置，<br><em>换个主人</em></h1>
    <p>教材、耳机、自行车、宿舍小家电。发布免费，交易当面，平台不碰钱。</p>
    <div class="search">
      <span class="ico"></span>
      <input id="q" type="search" placeholder="搜教材、耳机、自行车…" autocomplete="off">
    </div>
  </div>
</header>

<main class="wrap">
  <div class="chips" id="chips"></div>

  <div class="grid" id="grid"></div>

  <div id="sentinel" style="height:1px"></div>
  <div id="empty" class="empty" style="display:none">
    <div class="big">NO ITEMS YET</div>
    <p id="emptyText">这里还没有东西<br>把你的闲置挂上来吧</p>
  </div>
</main>

<footer class="foot">
  <div class="in">
    <div class="mono">CAMPUS MARKET</div>
    <p>只做信息撮合 · 不提供支付 · 交易请当面验货<br>
    <a href="notice.html">用户须知</a> · <a href="privacy.html">隐私政策</a></p>
  </div>
</footer>

<script src="assets/api.js"></script>
<script src="assets/auth.js"></script>
<script>
const CATS = ['教材书籍','学习资料','数码电子','生活用品','宿舍家具','服饰鞋包','运动器材','美妆个护','乐器文娱','交通工具','票券卡类','其他'];
let page = 1, hasMore = true, loading = false;
let curCat = qs('cat') || '', curQ = qs('q') || '';

/* ---- 分类 chips ---- */
function paintChips() {
  const box = document.getElementById('chips');
  const items = [''].concat(CATS);
  box.innerHTML = items.map(c => {
    const label = c || '全部';
    const on = c === curCat ? ' on' : '';
    return `<a class="chip${on}" href="#" data-cat="${esc(c)}">${esc(label)}</a>`;
  }).join('');
  box.querySelectorAll('.chip').forEach(el => {
    el.onclick = e => {
      e.preventDefault();
      curCat = el.dataset.cat;
      paintChips();
      reload();
    };
  });
}

/* ---- 卡片 ---- */
function cardHTML(it) {
  const img = it.thumb
    ? `<img src="${esc(it.thumb)}" loading="lazy" alt="" onerror="this.style.display='none';this.parentNode.classList.add('ph-fail')">`
    : `<div class="none">NO IMAGE</div>`;
  const sold = it.status === 'sold' ? '<span class="badge sold">已出</span>' : '';
  return `<a class="card" href="item.html?id=${it.id}">
    <div class="shot">${img}</div>
    <div class="body">
      <div class="title">${esc(it.title)}</div>
      <div class="price">${priceText(it.price)}${sold}</div>
      <div class="meta">
        <span class="cat">${esc(it.category)}</span>
        <span>${timeAgo(it.created_at)}</span>
      </div>
    </div>
  </a>`;
}

/* ---- 加载 ---- */
function setLoading(on) {
  loading = on;
  const bar = document.getElementById('loadbar');
  if (on) { bar.classList.remove('done'); bar.style.width = '40%'; }
  else { bar.style.width = '100%'; setTimeout(() => { bar.classList.add('done'); bar.style.width = '0'; }, 300); }
}

async function load(reset = false) {
  if (loading) return;
  if (reset) { page = 1; hasMore = true; document.getElementById('grid').innerHTML = ''; }
  if (!hasMore) return;
  setLoading(true);

  try {
    const qs2 = new URLSearchParams({ page, ...(curCat ? { cat: curCat } : {}), ...(curQ ? { q: curQ } : {}) });
    const r = await api('/items?' + qs2.toString(), { auth: false });

    const grid = document.getElementById('grid');
    if (reset) grid.innerHTML = '';
    grid.insertAdjacentHTML('beforeend', r.items.map(cardHTML).join(''));

    page += 1;
    hasMore = r.has_more;

    const empty = document.getElementById('empty');
    empty.style.display = (grid.children.length === 0) ? 'block' : 'none';
    if (curQ) {
      document.getElementById('emptyText').innerHTML = `没有找到「${esc(curQ)}」<br>换个词试试`;
    } else if (curCat) {
      document.getElementById('emptyText').innerHTML = `「${esc(curCat)}」下还没有东西<br>来发第一个`;
    }
  } catch (e) {
    toast(e.message);
  } finally {
    setLoading(false);
  }
}

function reload() {
  const url = new URL(location.href);
  curCat ? url.searchParams.set('cat', curCat) : url.searchParams.delete('cat');
  curQ ? url.searchParams.set('q', curQ) : url.searchParams.delete('q');
  history.replaceState(null, '', url);
  load(true);
}

/* ---- 触底加载 ---- */
function watchScroll() {
  const sentinel = document.getElementById('sentinel');
  new IntersectionObserver(es => {
    if (es[0].isIntersecting && hasMore && !loading) load();
  }, { rootMargin: '300px' }).observe(sentinel);
}

/* ---- 搜索 ---- */
function bindSearch() {
  const input = document.getElementById('q');
  input.value = curQ;
  let t;
  input.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      curQ = input.value.trim();
      reload();
    }, 420);
  });
}

/* ---- 启动 ---- */
(async function () {
  paintChips();
  bindSearch();
  await paintNav();
  await load(true);
  watchScroll();
  Auth.verify().then(() => paintNav());
})();
</script>
</body>
</html>
