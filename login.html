<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>登录 · 别丢</title>
<link rel="stylesheet" href="assets/app.css?v=20261023f">
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="index.html"><svg class="mark" viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" rx="17" fill="#FF5A1F"/><path d="M16 22v10a12 12 0 0 0 24 0V22" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><rect x="22.4" y="9.2" width="11.2" height="11.2" rx="3.6" fill="#fff"/></svg>别丢</a>
    <div class="nav-links" id="navActions"></div>
  </div>
</nav>

<main class="wrap" style="max-width:430px;padding-top:48px">
  <div class="kicker" style="margin-bottom:12px">SIGN IN</div>
  <h1 style="font-size:30px;letter-spacing:-.03em;margin-bottom:8px">欢迎回来</h1>
  <p style="font-size:13.5px;color:var(--ink-2);margin-bottom:26px">用注册时的手机号和密码登录，本机会记住你 180 天。</p>

  <div id="alert"></div>

  <form id="form">
    <div class="field">
      <label>手机号</label>
      <input id="sid" type="text" inputmode="numeric" maxlength="11" autocomplete="username" placeholder="注册时填写的手机号" required>
    </div>
    <div class="field">
      <label>密码</label>
      <input id="pwd" type="password" autocomplete="current-password" placeholder="至少 6 位" required>
    </div>
    <button class="btn block" id="btn" type="submit">登录</button>
  </form>

  <p class="form-foot">还没有账号？<a href="register.html">注册一个</a></p>
</main>

<script src="assets/api.js?v=20261023f"></script>
<script src="assets/auth.js?v=20261023f"></script>
<script>
const next = qs('next') || 'index.html';

document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const sid = document.getElementById('sid').value.trim();
  const pwd = document.getElementById('pwd').value;
  const box = document.getElementById('alert');
  box.innerHTML = '';

  btn.disabled = true;
  btn.textContent = '登录中…';

  try {
    const r = await api('/login', { method: 'POST', body: { sid, pwd }, auth: false });
    Auth.save(r.token, r.user);
    try { localStorage.setItem('last_phone', sid); } catch (e) {}
    location.href = next;
  } catch (err) {
    box.innerHTML = `<div class="alert err">${esc(err.message)}</div>`;
    btn.disabled = false;
    btn.textContent = '登录';
  }
};

(async function () {
  await paintNav();
  // 懒人化：回填上次登录用的手机号
  try {
    const last = localStorage.getItem('last_phone');
    if (last) document.getElementById('sid').value = last;
  } catch (e) {}
  if (Auth.logged) {
    const u = await Auth.verify();
    if (u) { location.href = next; return; }
  }
})();
</script>
</body>
</html>
